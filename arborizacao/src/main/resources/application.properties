# Carrega o arquivo local (gitignored) com as credenciais de desenvolvimento.
# O caminho é resolvido a partir do diretório de trabalho, então aceitamos
# tanto a raiz do projeto (./config) quanto o diretório pai (./arborizacao/config),
# que é o caso de execução pela IDE.
# Crie ./config/application-local.properties ou defina as variáveis DB_URL/DB_USERNAME/DB_PASSWORD.
spring.config.import=optional:file:./config/application-local.properties,optional:file:./arborizacao/config/application-local.properties

spring.application.name=arborizacao

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/arborizacao?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}
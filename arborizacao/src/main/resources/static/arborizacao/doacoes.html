<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Doações • Arborização</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app-shell">
    <div class="user-bar">
      <span id="userEmail">...</span>
      <a href="./cadastro-areas.html" class="ghost-button">← Áreas</a>
      <a href="./arvores.html" class="ghost-button">Árvores</a>
      <a href="./especies.html" class="ghost-button">Espécies</a>
      <a id="adminLink" href="./usuarios.html" class="ghost-button" data-admin hidden>Usuários</a>
      <a href="./historico.html" class="ghost-button" data-admin hidden>Histórico</a>
      <a href="/logout" class="ghost-button">Sair</a>
    </div>

    <section class="hero">
      <div>
        <p class="eyebrow">Amasvisa • Arborização Urbana</p>
        <h1>Doações de árvores</h1>
        <p class="hero-copy">Registre quem doou, para onde a muda foi destinada e a qual árvore ela corresponde.</p>
      </div>
    </section>

    <section class="workspace">
      <aside class="panel">
        <div class="panel-header">
          <h2 id="formTitle">Nova doação</h2>
        </div>
        <div id="formMessage"></div>
        <form id="doacaoForm" class="form-grid">
          <label>
            Árvore
            <select id="arvoreId" required>
              <option value="">Selecione...</option>
            </select>
          </label>
          <label>
            Solicitante / doador
            <input type="text" id="solicitante" />
          </label>
          <label>
            Data da doação
            <input type="date" id="dataDoacao" />
          </label>
          <label>
            Destinação
            <input type="text" id="destinacao" placeholder="Ex: Praça Central" />
          </label>
          <label>
            Descrição
            <textarea id="descricao" rows="3"></textarea>
          </label>
          <button type="submit" class="primary-button" id="saveBtn">Salvar</button>
          <button type="button" class="ghost-button hidden" id="cancelEditBtn">Cancelar edição</button>
        </form>
      </aside>

      <section class="panel">
        <div class="panel-header">
          <h2>Buscar doação</h2>
        </div>
        <form id="buscaForm" class="busca-form">
          <input type="text" id="buscaTermo" placeholder="Digite o nome do doador ou o ID..." />
          <button type="submit" class="primary-button">Buscar</button>
        </form>
        <p class="area-description">Você pode digitar o nome do solicitante/doador ou o ID.</p>
        <div id="buscaResultado"></div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>Doações registradas</h2>
        </div>
        <div id="doacoesList" class="areas-list"></div>
      </section>
    </section>
  </main>

  <script src="./auth.js"></script>
  <script src="./doacoes.js"></script>
</body>
</html>

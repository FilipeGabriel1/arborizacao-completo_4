  <ellipse cx="100" cy="220" rx="30" ry="8" fill="#1a6b1a" opacity="0.5"/>
  <ellipse cx="250" cy="230" rx="40" ry="10" fill="#1a6b1a" opacity="0.5"/>
  <text x="200" y="270" font-family="Arial" font-size="14" fill="#0d3d0d" text-anchor="middle" font-weight="bold">Bosque</text>

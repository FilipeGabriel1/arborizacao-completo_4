  <circle cx="100" cy="130" r="50" fill="#228B22"/>
  <circle cx="150" cy="145" r="45" fill="#2E8B57"/>
  <circle cx="200" cy="125" r="55" fill="#1a5c1a"/>
  <circle cx="250" cy="140" r="48" fill="#228B22"/>
  <circle cx="300" cy="135" r="52" fill="#2E8B57"/>
  <circle cx="350" cy="145" r="42" fill="#1a5c1a"/>
  <circle cx="80" cy="155" r="35" fill="#3CB371"/>
  <circle cx="130" cy="160" r="30" fill="#32CD32"/>
  <circle cx="180" cy="150" r="38" fill="#3CB371"/>
  <circle cx="230" cy="155" r="32" fill="#32CD32"/>
  <circle cx="280" cy="150" r="36" fill="#3CB371"/>

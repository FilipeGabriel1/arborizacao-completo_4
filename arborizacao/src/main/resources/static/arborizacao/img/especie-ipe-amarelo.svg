  <circle cx="200" cy="120" r="70" fill="#FFD700"/>
  <circle cx="165" cy="135" r="50" fill="#FFC107"/>
  <circle cx="235" cy="135" r="50" fill="#FFB300"/>
  <circle cx="200" cy="90" r="55" fill="#FFD700"/>
  <circle cx="170" cy="110" r="40" fill="#FFC107"/>
  <circle cx="230" cy="110" r="40" fill="#FFB300"/>
  <!-- Fallen petals -->
  <circle cx="100" cy="230" r="3" fill="#FFD700"/>
  <circle cx="150" cy="235" r="2" fill="#FFC107"/>
  <circle cx="250" cy="232" r="3" fill="#FFD700"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB"/>
      <stop offset="100%" style="stop-color:#E0F6FF"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#sky)"/>
  <rect y="230" width="400" height="70" fill="#228B22"/>
  <!-- Oiti tree - large dense canopy -->
  <rect x="180" y="160" width="40" height="80" fill="#8B4513"/>
  <circle cx="200" cy="130" r="80" fill="#2E7D32"/>
  <circle cx="150" cy="145" r="60" fill="#388E3C"/>
  <circle cx="250" cy="145" r="60" fill="#1B5E20"/>
  <circle cx="200" cy="100" r="65" fill="#2E7D32"/>
  <circle cx="160" cy="120" r="45" fill="#43A047"/>
  <circle cx="240" cy="120" r="45" fill="#388E3C"/>
  <!-- Leaves texture -->
  <circle cx="130" cy="130" r="8" fill="#4CAF50" opacity="0.6"/>
  <circle cx="270" cy="135" r="8" fill="#4CAF50" opacity="0.6"/>
  <circle cx="200" cy="80" r="10" fill="#4CAF50" opacity="0.6"/>
  <text x="200" y="280" font-family="Arial" font-size="14" fill="#1a5c1a" text-anchor="middle" font-weight="bold">Oiti</text>
</svg>

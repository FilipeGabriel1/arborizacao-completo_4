<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Usuários • Arborização</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app-shell">
    <div class="user-bar">
      <span id="userEmail">...</span>
      <a href="./cadastro-areas.html" class="ghost-button">Áreas</a>
      <a href="./arvores.html" class="ghost-button">Árvores</a>
      <a href="./especies.html" class="ghost-button">Espécies</a>
      <a href="./doacoes.html" class="ghost-button">Doações</a>
      <a href="./historico.html" class="ghost-button" data-admin hidden>Histórico</a>
      <a href="/logout" class="ghost-button">Sair</a>
    </div>

    <section class="hero">
      <div>
        <p class="eyebrow">Amasvisa • Arborização Urbana</p>
        <h1>Usuários com acesso ao sistema</h1>
        <p class="hero-copy">Crie um login para cada funcionário. Só administradores acessam esta tela.</p>
      </div>
    </section>

    <section class="workspace">
      <aside class="panel">
        <div class="panel-header">
          <h2 id="formTitle">Novo usuário</h2>
        </div>
        <div id="formMessage"></div>
        <form id="usuarioForm" class="form-grid">
          <input type="hidden" id="usuarioId" />
          <label>
            Nome
            <input type="text" id="nome" required />
          </label>
          <label>
            E-mail
            <input type="email" id="email" required />
          </label>
          <label id="senhaLabel">
            Senha
            <input type="password" id="senha" minlength="6" />
          </label>
          <label>
            Perfil
            <select id="perfil">
              <option value="FUNCIONARIO">Funcionário</option>
              <option value="ADMIN">Administrador</option>
            </select>
          </label>
          <button type="submit" class="primary-button" id="saveBtn">Salvar</button>
          <button type="button" class="ghost-button hidden" id="cancelEditBtn">Cancelar edição</button>
        </form>
      </aside>

      <section class="panel">
        <div class="panel-header">
          <h2>Funcionários cadastrados</h2>
        </div>
        <div id="usuariosList" class="areas-list"></div>
      </section>
    </section>
  </main>

  <script src="./auth.js"></script>
  <script src="./usuarios.js"></script>
</body>
</html>
